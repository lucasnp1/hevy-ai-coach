name: Daily coach check-in

on:
  schedule:
    # GitHub cron is ALWAYS UTC and can fire 5-30 min late.
    # 10:00 UTC = 11:00 UK during BST (summer). Weekdays only (Mon-Fri),
    # after the morning workout. In winter (GMT) this lands at 10:00 local —
    # nudge to "0 11 * * 1-5" if you want a steady 11:00 year-round.
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}

# Avoid overlapping runs racing on shared state.
concurrency:
  group: coach
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @anthropic-ai/claude-code
      - name: Coach today's workout
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
          USER_TIMEZONE: ${{ vars.USER_TIMEZONE || 'America/Sao_Paulo' }}
          REST_DAY_MESSAGES: ${{ vars.REST_DAY_MESSAGES || 'false' }}
        run: node scripts/coach.mjs daily
