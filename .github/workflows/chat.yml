name: Coach chat reply

# Fired by the Cloudflare Worker (via repository_dispatch) whenever you send
# the bot a Telegram message.
on:
  repository_dispatch:
    types: [telegram-message]

concurrency:
  group: coach
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @anthropic-ai/claude-code
      - name: Reply to the message
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
          USER_TIMEZONE: ${{ vars.USER_TIMEZONE || 'America/Sao_Paulo' }}
          CHAT_TEXT: ${{ github.event.client_payload.text }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: node scripts/coach.mjs chat
